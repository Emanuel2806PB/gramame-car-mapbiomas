project:
  name: gramame_car_mapbiomas
  output_dir: output/gramame_car_mapbiomas
  target_crs: EPSG:31985  # SIRGAS 2000 / UTM zona 25S

inputs:
  study_area:
    path: dados/limites/bacia_gramame.gpkg
    layer: bacia_gramame
  properties:
    path: dados/car/imoveis_rurais.gpkg
    layer: imoveis
    id_field: cod_imovel
    status_field: status_imovel
  declared_native:
    path: dados/car/vegetacao_nativa.gpkg
    layer: vegetacao_nativa
    id_field: cod_imovel
    status_field: ind_status
  mapbiomas:
    path: dados/mapbiomas/mapbiomas_coverage_collection_11_2025.tif
    year: 2025

analysis:
  # Classes naturais detalhadas dos níveis Floresta e Vegetação Herbácea e Arbustiva.
  # Fonte: legenda oficial da Coleção 11 do MapBiomas Brasil (30 m).
  natural_class_codes: [3, 4, 5, 6, 7, 11, 12, 29, 32, 49, 50, 77, 84]
  # CA = cadastro cancelado; AT e PE permanecem na análise exploratória.
  excluded_status_codes: [CA]
  raster_resolution_m: 30
  all_touched: false
  minimum_geometry_area_m2: 1.0
